name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The packed E2E builds a clone of the pinned Harness tag, so this must
          # be a Node the Harness itself validates (its CI runs 22.19 / 24.9 / 26
          # and defaults to the latest 24). Node 24.0.0 is not one of them: on it
          # `tsx` 4.22.4 leaves `import.meta.main` undefined, so every guarded
          # self-execution script in that clone — including its `build` script,
          # which the E2E depends on — exits 0 without doing anything.
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter dsh-context-compression-improved test
      - run: pnpm test:built
      - run: pnpm verify:release
      - run: pnpm pack:dry-run
      - run: pnpm test:e2e:packed
      - run: pnpm audit --audit-level high
